<script>
// ================================================================
//  Tiny pixel toolkit (shared by all three Turnbuckle Alley mockups)
//  Everything draws into a 384x216 Uint32 framebuffer, which is then
//  scaled up with integer nearest-neighbour scaling by CSS.
// ================================================================
'use strict';
const W = 384, H = 216;
const CV = document.getElementById('screen');
CV.width = W; CV.height = H;
const G2 = CV.getContext('2d', { alpha: false });
G2.imageSmoothingEnabled = false;
const IMG = G2.createImageData(W, H);
const FB = new Uint32Array(IMG.data.buffer);

// ---------- colour helpers (framebuffer is little-endian ABGR) ----------
const _cc = new Map();
function col(h) {
  if (typeof h === 'number') return h;
  let c = _cc.get(h);
  if (c !== undefined) return c;
  let s = h.charAt(0) === '#' ? h.slice(1) : h;
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  const n = parseInt(s, 16);
  c = (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | ((n >>> 16) & 255)) >>> 0;
  _cc.set(h, c);
  return c;
}
const cR = c => c & 255, cG = c => (c >>> 8) & 255, cB = c => (c >>> 16) & 255;
function pk(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r | 0;
  g = g < 0 ? 0 : g > 255 ? 255 : g | 0;
  b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
}
function mix(a, b, t) {
  a = col(a); b = col(b);
  return pk(cR(a) + (cR(b) - cR(a)) * t, cG(a) + (cG(b) - cG(a)) * t, cB(a) + (cB(b) - cB(a)) * t);
}
function mul(a, b) {
  a = col(a); b = col(b);
  return pk(cR(a) * cR(b) / 255, cG(a) * cG(b) / 255, cB(a) * cB(b) / 255);
}
function scr(a, b) {

  return pk(255 - (255 - cR(a)) * (255 - cR(b)) / 255, 255 - (255 - cG(a)) * (255 - cG(b)) / 255, 255 - (255 - cB(a)) * (255 - cB(b)) / 255);
}
function lum(c) { c = col(c); return (cR(c) * 0.3 + cG(c) * 0.59 + cB(c) * 0.11) / 255; }

// ---------- clipping ----------
// all primitives draw into the current target (the screen, or a sprite buffer via mkSpr)
let TB = FB, TWD = W, THT = H;
let CX0 = 0, CY0 = 0, CX1 = W, CY1 = H;
function clip(x, y, w, h) { CX0 = Math.max(0, x | 0); CY0 = Math.max(0, y | 0); CX1 = Math.min(TWD, (x + w) | 0); CY1 = Math.min(THT, (y + h) | 0); }
function noclip() { CX0 = 0; CY0 = 0; CX1 = TWD; CY1 = THT; }
// build a sprite procedurally: fn() draws with the normal primitives into a w x h buffer (0 = transparent)
function mkSpr(w, h, fn, name) {
  const s = { w, h, d: new Uint32Array(w * h), name };
  const sv = [TB, TWD, THT, CX0, CY0, CX1, CY1];
  TB = s.d; TWD = w; THT = h; CX0 = 0; CY0 = 0; CX1 = w; CY1 = h;
  try { fn(s); } finally { [TB, TWD, THT, CX0, CY0, CX1, CY1] = sv; }
  if (name) SHEET.push(s);
  return s;
}

// ---------- primitives ----------
// A "paint" c may be a colour (hex/number) or a function (x, y, old) -> colour|null
function P(x, y, c) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < CX0 || y < CY0 || x >= CX1 || y >= CY1 || c == null) return;
  const i = y * TWD + x;
  if (typeof c === 'function') { const v = c(x, y, TB[i]); if (v != null) TB[i] = col(v); }
  else TB[i] = typeof c === 'number' ? c : col(c);
}
function GP(x, y) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= TWD || y >= THT) return 0; return TB[y * TWD + x]; }
function R(x, y, w, h, c) {
  if (c == null) return;
  const x0 = Math.max(CX0, Math.floor(x)), y0 = Math.max(CY0, Math.floor(y));
  const x1 = Math.min(CX1, Math.floor(x + w)), y1 = Math.min(CY1, Math.floor(y + h));
  if (x1 <= x0) return;
  if (typeof c === 'function') { for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { const i = yy * TWD + xx, v = c(xx, yy, TB[i]); if (v != null) TB[i] = col(v); } return; }
  c = col(c);
  for (let yy = y0; yy < y1; yy++) TB.fill(c, yy * TWD + x0, yy * TWD + x1);
}
function HL(x0, x1, y, c) { if (x1 < x0) [x0, x1] = [x1, x0]; R(x0, y, x1 - x0 + 1, 1, c); }
function VL(x, y0, y1, c) { if (y1 < y0) [y0, y1] = [y1, y0]; R(x, y0, 1, y1 - y0 + 1, c); }
function L(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { P(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function box(x, y, w, h, c) { HL(x, x + w - 1, y, c); HL(x, x + w - 1, y + h - 1, c); VL(x, y, y + h - 1, c); VL(x + w - 1, y, y + h - 1, c); }
// rounded rectangle fill (r = corner radius 1..3)
function RR(x, y, w, h, r, c) {
  const cut = r === 1 ? [1] : r === 2 ? [2, 1] : r === 3 ? [3, 1, 1] : r >= 4 ? [4, 2, 1, 1] : [];
  for (let yy = 0; yy < h; yy++) {
    let k = 0;
    if (yy < cut.length) k = cut[yy]; else if (h - 1 - yy < cut.length) k = cut[h - 1 - yy];
    R(x + k, y + yy, w - 2 * k, 1, c);
  }
}
// rounded rect with border: border colour, then inset fill
function RRB(x, y, w, h, r, border, fill) { RR(x, y, w, h, r, border); if (fill != null) RR(x + 1, y + 1, w - 2, h - 2, Math.max(0, r - 1), fill); }
function poly(pts, c) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  y0 = Math.max(CY0, Math.floor(y0)); y1 = Math.min(CY1 - 1, Math.ceil(y1));
  const xs = [];
  for (let y = y0; y <= y1; y++) {
    const yc = y + 0.5; xs.length = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > yc) !== (yj > yc)) xs.push(xi + (yc - yi) * (xj - xi) / (yj - yi));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.ceil(xs[k] - 0.5), xb = Math.floor(xs[k + 1] - 0.5);
      for (let x = xa; x <= xb; x++) P(x, y, c);
    }
  }
}
function ell(cx, cy, rx, ry, c) {
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) P(x, y, c);
    }
}
function circ(cx, cy, r, c) { ell(cx, cy, r, r, c); }
// curved line (quadratic) for ropes / wires
function curve(x0, y0, x1, y1, sag, c, cb) {
  const n = Math.max(2, Math.ceil(Math.abs(x1 - x0) + Math.abs(y1 - y0)));
  let px = null, py = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t + sag * 4 * t * (1 - t);
    const rx = Math.round(x), ry = Math.round(y);
    if (rx !== px || ry !== py) { P(rx, ry, c); if (cb) cb(rx, ry, t, i); px = rx; py = ry; }
  }
}

// ---------- dithering ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const dth = (x, y, lvl) => BAYER[((y & 3) << 2) | (x & 3)] < lvl; // lvl 0..16
function DR(x, y, w, h, c1, c2, lvl) { c1 = col(c1); c2 = col(c2); R(x, y, w, h, (xx, yy) => dth(xx, yy, lvl) ? c2 : c1); }
// clustered-dot halftone threshold (period d, 45 degree screen)
function makeHalftone(d) {
  const t = new Float32Array(d * d);
  for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
    let u = ((x + y) % d) / d, v = ((x - y + d * 8) % d) / d;
    u = Math.min(u, 1 - u) * 2; v = Math.min(v, 1 - v) * 2; // 0 at lattice point
    t[y * d + x] = Math.sqrt(u * u + v * v) / Math.SQRT2 + (x * 0.0013 + y * 0.0007);
  }
  // rank-normalise so levels are evenly spaced
  const idx = [...t.keys()].sort((a, b) => t[a] - t[b]);
  const out = new Float32Array(d * d);
  idx.forEach((k, r) => out[k] = (r + 0.5) / (d * d));
  return { d, t: out };
}
const HT4 = makeHalftone(4), HT6 = makeHalftone(6), HT8 = makeHalftone(8);
const ht = (x, y, v, T = HT6) => T.t[(((y % T.d) + T.d) % T.d) * T.d + (((x % T.d) + T.d) % T.d)] < v; // v 0..1

// vertical gradient: stops = [colour,...], soft = fraction of each band that dithers
function VG(x, y, w, h, stops, soft = 0.5, ditherFn = dth) {
  const n = stops.length - 1, cs = stops.map(col);
  for (let yy = 0; yy < h; yy++) {
    const t = (yy / Math.max(1, h - 1)) * n;
    let i = Math.min(n - 1, Math.floor(t)), f = t - i;
    f = Math.max(0, Math.min(1, (f - 0.5) / Math.max(0.001, soft) + 0.5));
    const a = cs[i], b = cs[i + 1], lvl = Math.round(f * 16);
    R(x, y + yy, w, 1, (xx, py) => ditherFn(xx, py, lvl, f) ? b : a);
  }
}
// apply a function to every pixel in a rect
function MAP(x, y, w, h, fn) { R(x, y, w, h, (xx, yy, old) => fn(old, xx, yy)); }

// ---------- seeded random ----------
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hash2 = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ---------- sprites ----------
// rows: array of strings; pal: { ch: '#hex' | [c1, c2, level] (local dither) | null }
const SHEET = [];
function SP(rows, pal, name) {
  if (typeof rows === 'string') rows = rows.split('\n').map(r => r.trim()).filter(r => r.length);
  const h = rows.length;
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const d = new Uint32Array(w * h);
  rows.forEach((r, y) => {
    if (r.length !== w && name) console.warn('[sprite] ' + name + ' row ' + y + ' length ' + r.length + ' != ' + w);
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      let v = pal[ch];
      if (v === undefined) { if (name) console.warn('[sprite] ' + name + ' unknown char ' + ch); continue; }
      if (v === null) continue;
      if (Array.isArray(v)) v = dth(x, y, v[2]) ? v[1] : v[0];
      d[y * w + x] = col(v);
    }
  });

  if (name) SHEET.push(s);
  return s;
}
// draw sprite; o.flip mirrors horizontally; o.fn(colour,x,y) remaps colours
function DS(s, x, y, o) {
  x = Math.round(x); y = Math.round(y);
  const flip = o && o.flip, fn = o && o.fn;
  for (let yy = 0; yy < s.h; yy++) for (let xx = 0; xx < s.w; xx++) {
    const c = s.d[yy * s.w + (flip ? s.w - 1 - xx : xx)];

// draw a character grid straight onto the current target (handy inside mkSpr)
function stamp(rows, pal, x, y, o) { DS(SP(rows, pal), x, y, o); }
// add a 1px outline whose colour depends on the neighbouring fill colour.
// fn(fillColour, side) where side = 'lit' (top/left edge) or 'dark' (bottom/right edge)
function OUT(s, fn, diag = false) {
  const w = s.w + 2, h = s.h + 2, d = new Uint32Array(w * h);
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) d[(y + 1) * w + x + 1] = s.d[y * s.w + x];
  const src = d.slice();
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src[y * w + x];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (src[y * w + x]) continue;

    let n = at(x, y - 1), side = 'dark';
    if (!n) { n = at(x - 1, y); side = 'dark'; }
    if (!n) { n = at(x + 1, y); side = 'lit'; }
    if (!n) { n = at(x, y + 1); side = 'lit'; }

// silhouette helper: iterate opaque pixels
function eachPx(s, cb) { for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) if (s.d[y * s.w + x]) cb(x, y, s.d[y * s.w + x]); }

  const seen = new Set();
  eachPx(s, (sx, sy) => {
    const hgt = (s.h - 1 - sy);

      P(gx + k, gy, paint);

// main proportional font: cap height 7, descenders to row 8
const FM = mkFont({

// ---------- page shell: scaling, scene switching, animation loop ----------
let SCENE = 1, TICK = 0, DIRTY = true, SCENE_T0 = 0;
const SCENES = {};
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  let s = Math.floor(Math.min(vw * dpr / W, vh * dpr / H));
  // thumbnails (and tiny windows) fill their box; full pages keep exact integer scaling
  if (s < 1 || document.body.classList.contains('embed')) s = Math.min(vw * dpr / W, vh * dpr / H);
  CV.style.width = (W * s / dpr) + 'px';
  CV.style.height = (H * s / dpr) + 'px';
}
function setScene(n) {
  SCENE = n; DIRTY = true; SCENE_T0 = TICK;
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', +b.dataset.scene === n));
}
function boot() {
  if (/embed/.test(location.hash)) document.body.classList.add('embed');
  fit();
  addEventListener('resize', fit);
  addEventListener('keydown', e => { if (e.key === '1') setScene(1); if (e.key === '2') setScene(2); });
  document.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => setScene(+b.dataset.scene)));
  setScene(/scene2|^#2$/.test(location.hash) ? 2 : 1);
  const sheet = /sheet/.test(location.hash);
  // debug magnifier: #z=x,y,factor shows a region of the frame enlarged (for art review)
  const zm = /z=(\d+),(\d+),(\d+)/.exec(location.hash);
  const ZOOM = zm ? zm.slice(1).map(Number) : null;
  const frame = ts => {
    const tk = Math.floor(ts / 1000 * 12);
    if (tk !== TICK || DIRTY) {
      TICK = tk; DIRTY = false;
      noclip();
      if (sheet) drawSheet(); else SCENES[SCENE](tk);
      noclip();
      if (ZOOM) { const [zx, zy, f] = ZOOM, src = FB.slice(); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const sx = zx + Math.floor(x / f), sy = zy + Math.floor(y / f); FB[y * W + x] = (sx < W && sy < H) ? src[sy * W + sx] : 0xff000000; } }
      G2.putImageData(IMG, 0, 0);
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function drawSheet() {
  R(0, 0, W, H, '#777788');
  let x = 2, y = 2, rowH = 0;
  for (const s of SHEET) {
    if (x + s.w > W - 2) { x = 2; y += rowH + 3; rowH = 0; }
    DS(s, x, y); x += s.w + 3; rowH = Math.max(rowH, s.h);
  }
}

  for (const [k, c] of [[0.3, '#ff3a5a'], [0.55, '#ffe23a'], [0.8, '#ff3a5a']]) boxB(x - 3, yb - h * k - 3 - h * 0.15, 7, 6, 2, c, mix(c, OL, 0.35));
}
function ringFrontB() {
  const { fl, fr } = BR;
  postB(fl[0], fl[1], 32); postB(fr[0], fr[1], 32);
  [9, 18, 27].forEach((h, i) => { const c = ['#ff3a5a', '#ffffff', '#3a7aff'][i]; HL(fl[0] + 3, fr[0] - 3, fl[1] - h, c); HL(fl[0] + 3, fr[0] - 3, fl[1] - h + 1, OL); });
  // apron
  RRB(fl[0] - 4, fl[1], fr[0] - fl[0] + 8, 24, 1, OL, '#ff3a4a');
  R(fl[0] - 3, fl[1] + 1, fr[0] - fl[0] + 6, 3, '#ff8a8a');
  const pts = []; for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2, r = i % 2 ? 8 : 12; pts.push([172 + Math.cos(a) * r * 2.2, 162 + Math.sin(a) * r * 0.75]); }
  polyB(pts, '#ffe23a');
  TC('ACW', 172, 159, '#ff3a4a', FM, { bold: true, outline: OL });
  for (const sx of [96, 248]) { TC('*', sx, 158, '#ffffff', FM, {}); }
}

// ---- card (toy-package style) ----
function cardB(t) {
  const x = 298, y = 96 + ((t >> 3) & 1), w = 80, h = 114;
  R(x + 4, y + 4, w, h, '#0e0624');
  RRB(x - 1, y - 1, w + 2, h + 2, 4, OL, OL);
  RRB(x, y, w, h, 4, OL, '#fff4d0');
  R(x + 1, y + 1, w - 2, 22, '#ff3a4a'); HL(x + 1, x + w - 2, y + 23, OL);
  TC('TOP ROPE', x + 52, y + 3, '#ffffff', FM, { bold: true, outline: OL });
  TC('CROSSBODY', x + 52, y + 13, '#ffe23a', FM, { outline: OL });
  // illustration window: radial burst + Mariposa
  const ix = x + 4, iy = y + 26, iw = w - 8, ih = 42;
  RRB(ix - 1, iy - 1, iw + 2, ih + 2, 1, OL, '#3a7aff');
  clip(ix, iy, iw, ih);
  const cx = ix + iw / 2, cy = iy + ih / 2;
  R(ix, iy, iw, ih, (X, Y) => (Math.floor((Math.atan2(Y - cy, X - cx) + Math.PI) / (Math.PI / 8) + t * 0.05) % 2) ? '#3a7aff' : '#5a9aff');
  DS(B_MARI, ix + 3, iy - 6);
  noclip();
  // cost starburst
  const gx = x + 4, gy = y + 4;
  const pts = []; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + t * 0.04, r = i % 2 ? 8 : 11; pts.push([gx + 7 + Math.cos(a) * r, gy + 7 + Math.sin(a) * r]); }
  polyB(pts, '#ffe23a');
  T('2', gx + 3, gy + 1, '#ff3a4a', FM, { scale: 2, outline: OL });
  // type ribbon
  const ry = iy + ih + 3;
  polyB([[x + 12, ry], [x + w - 12, ry], [x + w - 8, ry + 5], [x + w - 12, ry + 10], [x + 12, ry + 10], [x + 8, ry + 5]], '#2ad0c0');
  TC('AERIAL', x + w / 2, ry + 3, '#ffffff', FT, { outline: OL, ls: 1 });
  // effect text
  const ty = ry + 14;
  T('12', T('+', x + 6, ty, '#ff3a4a', FM, {}) + 1, ty, '#ff3a4a', FM, { bold: true });
  T('Crowd.', x + 30, ty, OL, FM, {});
  T('Opponent goes', x + 6, ty + 11, OL, FM, {});
  T('DOWN!', x + 6, ty + 21, '#3a7aff', FM, { bold: true, outline: OL });
}

const BCONF = Array.from({ length: 46 }, (_, i) => { const r = rng(800 + i); return { x: r() * W, y: r() * H, v: 0.35 + r() * 0.5, d: r() * 6.28, c: BF_SHIRT[i % BF_SHIRT.length], k: i % 3 }; });

SCENES[2] = function (t) {
  // radial burst backdrop
  const bcx = 172, bcy = 70;
  R(0, 0, W, 110, (x, y) => (Math.floor((Math.atan2(y - bcy, x - bcx) + Math.PI) / (Math.PI / 12) + t * 0.03) % 2) ? '#3a1a98' : '#4e2ab8');
  // truss + spotlight cans
  R(0, 4, W, 3, OL); R(0, 10, W, 3, OL); for (let x = 0; x < W; x += 6) L(x, 7, x + 3, 10, OL);
  // neon sign
  RRB(116, 15, 112, 22, 4, OL, '#1b1033');
  const fl = [7, 8, 30].includes(t % 70);
  TC('SATURDAY NIGHT', 172, 19, fl ? '#ff8ac8' : '#ffffff', FM, { bold: true, outline: fl ? '#7a2a6a' : '#ff3aa8' });
  for (let x = 120; x < 226; x += 6) { P(x, 33, ((x / 6 + (t >> 1)) % 3) ? '#ffe23a' : '#ffffff'); }
  // bleachers of big-headed fans
  const r = rng(55);
  for (let row = 0; row < 3; row++) {
    const y = 48 + row * 15, s = 6 + row;
    R(0, y + s + 2, W, 20, row === 0 ? '#2a1478' : row === 1 ? '#321a88' : '#3a1e98');
    for (let x = 4 + row * 7; x < W; x += s * 2 + 6 + Math.floor(r() * 4)) {
      const o = { s, skin: BF_SKIN[(r() * BF_SKIN.length) | 0], hairC: BF_HAIR[(r() * BF_HAIR.length) | 0], hair: (r() * 6) | 0, shirt: BF_SHIRT[(r() * BF_SHIRT.length) | 0], cap: BF_SHIRT[(r() * BF_SHIRT.length) | 0], arms: r() < 0.4, open: r() < 0.6 };
      if (row < 2) { const sil = row === 0 ? '#22105e' : '#2c1872'; o.skin = sil; o.hairC = row === 0 ? '#1c0c50' : '#241466'; o.shirt = sil; o.cap = o.hairC; }
      if (row === 2 && (x < 54 || (x > 280 && x < 330))) continue;
      o.bob = o.arms && (((t >> 2) + x) % 4 < 2);
      fanB(x, y, o);
    }
  }
  // signs held up in the crowd
  signB(196, 44, 46, ['EARL READS', 'TO MY KIDS'], '#fff4d0', '#3a7aff');
  signB(150, 38, 40, ['MARIPOSA', '4 EVER!'], '#ff9ad0', '#6a1a70');
  signB(250, 46, 30, ['BOO!', 'GIDEON'], '#7ae04a', '#ff3a4a');
  // Pip with his belt up
  { const pb = (t >> 3) & 1; boxB(286, 66 - pb, 30, 9, 4, '#d9a060', '#a86a3a'); ovalB(301, 70 - pb, 7, 5, '#ffe23a', '#e0a020'); T('#1', 296, 68 - pb, '#e0304a', FT, {});
    fanB(301, 88, { s: 8, skin: '#ffd2b0', hairC: '#ff7a2a', hair: 0, shirt: '#ffffff', arms: true, open: false, bob: false }); }
  // barricade
  R(0, 100, W, 6, OL); R(0, 101, W, 3, '#5a4ad0');
  // Agnes swinging her purse + WHAP lines
  DS(B_AGNES, 14, 64);
  { const ang = Math.sin(t * 0.4) * 1.3 - 0.4, hx = 40, hy = 77; const px = hx + Math.cos(ang - 1.57) * 12, py = hy + Math.sin(ang - 1.57) * 12;
    L(hx, hy, px + 7, py + 1, OL); DS(B_PURSE, px, py - 2);
    for (let k = 1; k < 4; k++) { const a2 = ang - 1.57 - k * 0.25 * Math.sign(Math.cos(t * 0.4) || 1); P(hx + Math.cos(a2) * 16, hy + Math.sin(a2) * 16, '#ffffff'); P(hx + Math.cos(a2) * 18, hy + Math.sin(a2) * 18, '#ffffff'); }
    if (Math.abs(Math.sin(t * 0.4)) > 0.85) T('WHAP!', 50, 56, '#ffe23a', FT, { outline: OL }); }
  // floor
  R(0, 106, W, 110, '#2a1878');
  ringBackB();
  // spotlight beams (flat, hard-edged)
  poly([[96, 12], [104, 12], [150, 92], [116, 96]], (x, y, o) => mix(o, '#fff8a0', 0.28));
  poly([[262, 12], [270, 12], [214, 140], [178, 140]], (x, y, o) => mix(o, '#fff8a0', 0.22));
  ell(196, 140, 22, 5, (x, y, o) => mix(o, '#fff8a0', 0.35));
  // ref + Gideon
  DS(B_REF, 214, 76);
  DS(B_GID, 172, 86);
  // speed lines + Mariposa diving in from the top rope
  // halo so she pops off the crowd, and her shadow on the mat
  ell(117, 66, 36, 30, (x, y, o) => mix(o, '#fff4a0', 0.22)); ell(117, 66, 26, 22, (x, y, o) => mix(o, '#ffffff', 0.12));
  ell(126, 122, 13, 3, (x, y, o) => mul(o, '#a8a0e0'));
  for (let k = 0; k < 4; k++) { const y0 = 70 + k * 6; L(98 - k * 2, y0 + 18, 82 + k * 3, y0 - 4, OL); L(99 - k * 2, y0 + 18, 83 + k * 3, y0 - 4, '#ffffff'); }
  DS(B_MARI, 84, 42 + ((t >> 2) & 1));
  // anticipation burst between them
  if ((t >> 2) % 2) { for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; L(160 + Math.cos(a) * 5, 74 + Math.sin(a) * 5, 160 + Math.cos(a) * 9, 74 + Math.sin(a) * 9, '#ffe23a'); } }
  ringFrontB();
  // foreground fans with foam fingers
  const r2 = rng(21);
  for (const [fx, fy] of [[12, 130], [40, 136], [20, 160], [52, 164]]) {
    boxB(fx - 10, fy + 6, 21, 18, 5, '#2c1872', '#22105e'); ovalB(fx, fy, 8, 8, '#341e80', '#2c1872');
    HL(fx - 4, fx + 4, fy - 8, '#8a6ae0');
  }
  for (const fx of [10, 36, 62, 190, 216, 242, 268]) {
    const s = 10, y = 200 + (r2() * 4 | 0);
    boxB(fx - 13, y + 8, 27, 20, 6, '#24125e', '#1b0e4a');
    ovalB(fx, y, s, s, '#2e1870', '#24125e');
    if (r2() < 0.55) { const up = ((t >> 2) + fx) % 4 < 2 ? 1 : 0; limbB(fx + 9, y + 6, fx + 12, y - 8 - up, 4, '#24125e'); boxB(fx + 11, y - 30 - up, 5, 12, 2, '#ffe23a', '#e0a020'); boxB(fx + 7, y - 20 - up, 14, 13, 4, '#ffe23a', '#e0a020', '#fff8a0'); T('#1', fx + 9, y - 16 - up, '#ff3a4a', FT, {}); }
  }
  // chunky confetti + stars
  for (const c of BCONF) {
    const y = (c.y + t * c.v) % (H + 10) - 5, x = c.x + Math.sin(t * 0.08 + c.d) * 5;
    if (c.k === 0) { R(x, y, 3, 2, OL); R(x, y, 2, 1, c.c); }
    else if (c.k === 1) { const s = ((t >> 2) + (c.d * 9 | 0)) % 2; if (s) { P(x, y - 1, c.c); P(x, y + 1, c.c); P(x - 1, y, c.c); P(x + 1, y, c.c); P(x, y, '#ffffff'); } else P(x, y, c.c); }
    else { R(x, y, 2, 3, OL); P(x, y, c.c); P(x, y + 1, c.c); }
  }
  cardB(t);
};
